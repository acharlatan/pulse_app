<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PULSE release visual QA</title>
<style>body{font:14px system-ui;margin:20px;background:#ece7f0;color:#292134}header{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}label{display:grid;gap:5px}select,button{font:inherit;padding:10px;border:1px solid #8a7b98;border-radius:7px;background:white;color:#292134}button{cursor:pointer}#stage{overflow:auto;height:850px}iframe{display:block;border:0;background:white;box-shadow:0 4px 24px #22183320}output{display:block;white-space:pre-wrap;margin:15px 0;padding:14px;background:white;max-height:250px;overflow:auto}#results{white-space:pre-wrap;line-height:1.5}</style></head>
<body><header><strong>PULSE · Release QA</strong><label>Width<select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1280</option><option>1440</option></select></label><label>Screen<select id="route"><option value="/">Daily Pulse</option><option value="/focus">My Focus</option><option value="/network">People</option><option value="/orbit">Orbit</option><option value="/pipeline">Pipeline</option><option value="/activity">Follow-ups</option><option value="/analytics">Analytics</option><option value="/help">Help</option><option value="/network/people/contact-0">Person</option><option value="/network/companies/org-0">Company</option></select></label><label>Theme<select id="theme"><option>light</option><option>dark</option></select></label><label>Accent<select id="accent"><option>periwinkle</option><option>forest</option><option>coral</option><option>blue</option></select></label><button id="audit">Audit current</button><button id="matrix">Run responsive matrix</button><button id="accessibility">Run accessibility checks</button></header><output id="status">Choose a screen to inspect the real app at a supported viewport width.</output><div id="stage"><iframe id="preview" title="PULSE viewport" width="390" height="800" src="/#/"></iframe></div><h2>Audit findings</h2><div id="results">No audit run yet.</div>
<script>
const frame=document.querySelector('iframe'), status=document.querySelector('#status'), results=document.querySelector('#results');
const widths=[320,375,390,430,768,1024,1280,1440];
const routes=[...document.querySelector('#route').options].map(o=>o.value);
const pause=ms=>new Promise(r=>setTimeout(r,ms));
const apply=()=>{const root=frame.contentDocument?.documentElement;if(root){root.dataset.theme=document.querySelector('#theme').value;root.dataset.accent=document.querySelector('#accent').value;}};
async function ready(){for(let i=0;i<150;i++){if(frame.contentDocument?.querySelector('main h1'))return;await pause(100);}throw Error('App not ready: '+frame.src);}
async function navigate(route){frame.src='/#'+route;await pause(250);await ready();apply();await pause(150);}
const overflow=()=>{const d=frame.contentDocument;return [...d.querySelectorAll('body *')].filter(e=>{const b=e.getBoundingClientRect();return b.width>0&&b.right>d.documentElement.clientWidth+1&&!e.closest('.orbit-viewport,.pulse-chart-scroll,.pipeline-grid,.orbit-world,.orbit-canvas');}).map(e=>({tag:e.tagName,cls:e.className,right:Math.round(e.getBoundingClientRect().right)})).slice(0,12);};
document.querySelector('#width').onchange=e=>{frame.width=e.target.value;};
document.querySelector('#route').onchange=e=>navigate(e.target.value);
document.querySelector('#theme').onchange=apply;document.querySelector('#accent').onchange=apply;
frame.addEventListener('load',async()=>{await ready();apply();});
document.querySelector('#audit').onclick=()=>{const d=frame.contentDocument;status.textContent=`${frame.width}px ${d.documentElement.dataset.theme}: ${d.documentElement.scrollWidth<=d.documentElement.clientWidth?'PASS':'OVERFLOW'} (${d.documentElement.scrollWidth}/${d.documentElement.clientWidth}px)`;results.textContent=JSON.stringify(overflow(),null,2);};
document.querySelector('#matrix').onclick=async()=>{const rows=[];try{for(const theme of ['light','dark']){document.querySelector('#theme').value=theme;for(const route of routes){document.querySelector('#route').value=route;await navigate(route);for(const width of widths){frame.width=width;document.querySelector('#width').value=width;await pause(100);apply();const d=frame.contentDocument;const ok=d.documentElement.scrollWidth<=d.documentElement.clientWidth;rows.push({theme,route,width,ok,...(!ok?{elements:overflow()}:{})});status.textContent=`Running ${rows.length}/160 · ${theme} ${route} ${width}px`;}}}const failed=rows.filter(r=>!r.ok);status.textContent=`Responsive matrix: ${rows.length-failed.length}/${rows.length} PASS`;results.textContent=JSON.stringify(failed.length?failed:rows,null,2);}catch(e){status.textContent=String(e);}};
document.querySelector('#accessibility').onclick=async()=>{const rows=[];try{for(const theme of ['light','dark']){document.querySelector('#theme').value=theme;for(const route of ['/','/network','/orbit','/pipeline','/analytics','/help']){document.querySelector('#route').value=route;await navigate(route);for(const width of [390,1440]){frame.width=width;document.querySelector('#width').value=width;await pause(200);apply();if(!frame.contentWindow.axe){const script=frame.contentDocument.createElement('script');script.src='/node_modules/axe-core/axe.min.js';await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=reject;frame.contentDocument.head.append(script);});}const scan=await frame.contentWindow.axe.run(frame.contentDocument,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa']}});const violations=scan.violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary,html:n.html}))}));rows.push({theme,route,width,violations});status.textContent=`Accessibility ${rows.length}/24 · ${theme} ${route} ${width}px`;results.textContent=JSON.stringify(rows.filter(r=>r.violations.length),null,2);}}}const count=rows.reduce((n,r)=>n+r.violations.length,0);status.textContent=`Accessibility: ${24} checks, ${count} findings`;results.textContent=JSON.stringify(rows,null,2);}catch(e){status.textContent=String(e);}};
</script></body></html>
