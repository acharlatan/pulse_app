name: Release checks

on:
  push:
    branches: [main]
  pull_request:
    branches:
      [
        main,
        hardening/v1-phase-1,
        hardening/v1-phase-2,
        hardening/v1-phase-3,
        hardening/v1-archive,
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:worker

  data-recovery-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Backup, stale edits and workspace isolation
        run: npm run test:browser -- --config=playwright.production.config.ts tests/browser/backup-integrity.spec.ts tests/browser/release07.spec.ts tests/browser/workspace22.spec.ts tests/browser/iteration09.spec.ts tests/browser/iteration10.spec.ts --grep 'backup transfers|edited dialog dismissal|denied IndexedDB|switching workspaces|local profile portraits|disabled rule creates|invalid, incomplete|warns when' --workers=2
      - name: Offline persistence and updates
        if: ${{ !cancelled() }}
        run: npm run test:pwa -- tests/pwa/reliability.spec.ts --workers=1
      - name: Preserve browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: data-recovery-browser-results
          path: |
            test-results/
            .codex/pwa-results/
          if-no-files-found: ignore

  core-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Core workflow and source-record navigation
        run: npm run test:browser -- --config=playwright.production.config.ts tests/browser/phase3-journey.spec.ts tests/browser/phase3-deletion.spec.ts tests/browser/phase3-search.spec.ts tests/browser/phase3-orbit-motion.spec.ts tests/browser/iteration10.spec.ts tests/browser/analytics44.spec.ts tests/browser/orbit43.spec.ts tests/browser/focus42.spec.ts --grep 'a new consultant|editing and deletion|global search respects|3D Orbit portraits move|a restricted contact blocks|visual Analytics charts|focused map follows|Focus, relationship context' --workers=2
      - name: Archive and recovery journey
        run: npm run test:browser -- --config=playwright.production.config.ts tests/browser/archive.spec.ts --workers=2
      - name: Preserve journey diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-journey-results
          path: test-results/
          if-no-files-found: ignore

  phase4-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Width, theme, accent and accessibility matrix
        run: npm run test:browser -- --config=playwright.phase4.config.ts --project=chromium tests/browser/phase4-layout.spec.ts --workers=1
      - name: Preserve visual and accessibility evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase4-layout-evidence
          path: test-results/
          if-no-files-found: warn

  phase4-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - name: Keyboard, forms, search and Orbit list
        run: npm run test:browser -- --config=playwright.phase4.config.ts --project=${{ matrix.browser }} tests/browser/phase4-keyboard.spec.ts tests/browser/phase3-journey.spec.ts --workers=1
      - name: Preserve engine diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase4-${{ matrix.browser }}-results
          path: test-results/
          if-no-files-found: ignore

  phase4-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Synthetic 100 and 1000 contact workspaces
        run: npm run test:pwa -- tests/pwa/scale.spec.ts --workers=1
      - name: Preserve scale observations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase4-scale-evidence
          path: .codex/pwa-results/
          if-no-files-found: warn
